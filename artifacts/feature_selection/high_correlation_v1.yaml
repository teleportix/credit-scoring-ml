experiment: correlation_pruning_v1
date: 2026-02-11

rule:
  description: >
    Features removed due to high pairwise correlation
    to reduce multicollinearity in Logistic Regression.
  threshold: 0.9
  applied_to_model: logistic_regression

before:
  n_features: 403
  cv_auc: 0.7753
  cv_std: 0.0042
  fit_time: 2461

after:
  n_features: 342
  cv_auc: 0.7753
  cv_std: 0.0042
  fit_time: 1961

