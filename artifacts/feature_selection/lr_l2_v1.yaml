experiment: lr_l2_v1
date: 2026-02-11

model:
  type: logistic_regression
  penalty: l2
  solver: saga
  C: 0.001
  class_weight: balanced
  max_iter: 3000
  random_state: 42

selection_criteria:
  cv_auc: 0.7751
  cv_std: 0.004
  fit_time: 209
  reasoning: >
    Low C hyperparameter (~0.001) for L2 gives the fastest and most robust model.
    L1 regularization doesn't increase performance, but much slower and less stable.
